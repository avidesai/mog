name: core
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest
      - run: cd core && python -m pytest -q
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node scripts/strings.mjs --check
      - name: data files unchanged by regeneration
        run: |
          cd core && python tools/build_reference.py >/dev/null && git diff --exit-code data/composite_reference.json
  swift:
    # MogCore has never been compiled (authored without a toolchain). Allowed to fail until the first
    # green run, then remove continue-on-error so the fixture gate blocks again.
    continue-on-error: true
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: cd core/swift/MogCore && ./sync-data.sh && swift build && swift test
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -q postgresql-client
      - run: backend/supabase/tests/run_local.sh "host=localhost port=5432 user=postgres password=postgres"
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd backend/supabase && cp ../../core/data/denylist.json functions/_shared/denylist.json && node --experimental-strip-types --test tests/functions.test.mjs
