name: policies-site
on:
  push:
    branches: [main]
    paths: ["core/legal/**", "site/**"]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build-deploy:
    if: vars.POLICIES_BASE_URL != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install markdown
      - run: >
          python site/build.py --app-name "${{ vars.APP_NAME || 'Mog' }}" --entity "${{ vars.LEGAL_ENTITY }}"
          --email "${{ vars.CONTACT_EMAIL }}" --address "${{ vars.POSTAL_ADDRESS }}"
          --effective "${{ vars.POLICY_EFFECTIVE_DATE }}" --base-url "${{ vars.POLICIES_BASE_URL }}"
      - uses: actions/upload-pages-artifact@v3
        with: { path: site/dist }
      - id: d
        uses: actions/deploy-pages@v4
