# XcodeGen spec for the spike tools (vertex picker, landmark dump). Dev only: the product is the Exact app in app/.
# Generate the project with:  brew install xcodegen && cd ios && xcodegen generate
# The .xcodeproj is gitignored on purpose; this file is the source of truth.
name: Mog
options:
  bundleIdPrefix: com.avidesai
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}   # set in Config/Secrets.xcconfig
    CODE_SIGN_STYLE: Automatic

configFiles:
  Debug: Mog/Config/Debug.xcconfig
  Release: Mog/Config/Release.xcconfig

packages:
  MogCore:
    path: ../core/swift/MogCore

targets:
  Mog:
    type: application
    platform: iOS
    sources:
      - path: Mog
        excludes: ["Config/*.xcconfig"]
      # the gate labels and hints, bundled read-only
      - path: ../core/copy/strings.json
        buildPhase: resources
      - path: Mog/Geometry/landmark_map.json
        buildPhase: resources
    dependencies:
      - package: MogCore
    info:
      path: Mog/Config/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Used to measure facial proportions on this device. Images are processed here and deleted in seconds; they never leave your phone."
        NSFaceIDUsageDescription: "Not used. Face ID is never requested."
        UIRequiredDeviceCapabilities: [arkit, front-facing-camera]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avidesai.mog.spike   # the Exact app owns com.avidesai.mog; both sit on one phone in spike 1
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    preBuildScripts:
      - name: Sync MogCore data
        script: |
          "${SRCROOT}/../core/swift/MogCore/sync-data.sh"
        basedOnDependencyAnalysis: false

  MogTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MogTests]
    dependencies:
      - target: Mog

schemes:
  Mog:
    build:
      targets: { Mog: all, MogTests: [test] }
    run:
      config: Debug
    test:
      config: Debug
      targets: [MogTests]
