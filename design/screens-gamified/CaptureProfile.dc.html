<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Capture — profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap');
body{margin:0;font-family:"Inter Tight",system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:#2E5BFF}a:hover{color:#1F44CC}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF9F5; display: flex; flex-direction: column; overflow: hidden">

  <div style="height: 56px; display: flex; align-items: center; padding: 0 20px; flex-shrink: 0">
    <button type="button" aria-label="Cancel capture" style="width: 44px; height: 44px; margin-left: -12px; background: none; border: none; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="#4A443D" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <span style="margin-left: 4px; font-size: 17px; font-weight: 600; letter-spacing: -0.016em; color: #1A1714">Profile</span>
    <span style="margin-left: auto; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; color: #7A7268">2 of 2</span>
  </div>

  <div style="padding: 2px 20px 0; flex-shrink: 0">
    <p style="margin: 0; font-size: 14px; line-height: 20px; letter-spacing: -0.012em; color: #4A443D">This one uses the back camera. Prop the phone up at arm's length, turn to your right, and the timer does the rest.</p>
  </div>

  <div style="padding: 14px 20px 0; display: flex; gap: 6px; flex-wrap: wrap; flex-shrink: 0">
    <span style="display: flex; align-items: center; gap: 5px; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.01em; padding: 5px 10px; border-radius: 999px; background: #E6F4EC; color: #157A49">
      <svg width="10" height="8" viewBox="0 0 10 8" fill="none" aria-hidden="true"><path d="M1 4l2.5 2.5L9 1" stroke="#157A49" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Level</span>
    <span style="display: flex; align-items: center; gap: 5px; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.01em; padding: 5px 10px; border-radius: 999px; background: #E6F4EC; color: #157A49">
      <svg width="10" height="8" viewBox="0 0 10 8" fill="none" aria-hidden="true"><path d="M1 4l2.5 2.5L9 1" stroke="#157A49" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Light</span>
    <span style="display: flex; align-items: center; gap: 5px; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.01em; padding: 5px 10px; border-radius: 999px; background: #E6F4EC; color: #157A49">
      <svg width="10" height="8" viewBox="0 0 10 8" fill="none" aria-hidden="true"><path d="M1 4l2.5 2.5L9 1" stroke="#157A49" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Distance</span>
    <span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.01em; padding: 5px 10px; border-radius: 999px; border: 1.5px solid #9A6514; color: #9A6514">Turned 90°</span>
  </div>

  <div style="padding: 14px 20px 0; flex-grow: 1; min-height: 0">
    <div style="height: 100%; border-radius: 20px; overflow: hidden; background: #221F1A; position: relative; display: flex; align-items: center; justify-content: center">
      <svg viewBox="0 0 200 270" width="200" height="270" aria-hidden="true">
        <path d="M74 20c46 0 78 34 80 80 2 36-6 60-12 82-5 18 7 22 15 27 7 3 4 10-4 13l-30 12c-7 2-10 7-10 15v21" fill="none" stroke="#9A6514" stroke-width="2"/>
        <line x1="20" y1="122" x2="190" y2="122" stroke="#4A443D" stroke-width="1" stroke-dasharray="5 5"/>
        <path d="M40 40h-18M40 230h-18" stroke="#4A443D" stroke-width="1"/>
      </svg>
      <div style="position: absolute; left: 0; right: 0; bottom: 18px; text-align: center">
        <span style="display: inline-block; background: #FBF9F5; color: #1A1714; font-size: 15px; font-weight: 600; letter-spacing: -0.012em; padding: 10px 18px; border-radius: 999px">Turn a little more — ear to the centre</span>
      </div>
    </div>
  </div>

  <div style="padding: 18px 20px 26px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 28px">
    <span style="font-size: 13px; font-weight: 600; letter-spacing: -0.01em; color: #7A7268; width: 86px; text-align: right">Timer</span>
    <div style="position: relative; width: 78px; height: 78px">
      <svg width="78" height="78" viewBox="0 0 78 78" style="position: absolute; inset: 0" aria-hidden="true">
        <circle cx="39" cy="39" r="36" fill="none" stroke="#EFE9DD" stroke-width="4"/>
        <circle cx="39" cy="39" r="36" fill="none" stroke="#2E5BFF" stroke-width="4" stroke-linecap="round" stroke-dasharray="226" stroke-dashoffset="56" transform="rotate(-90 39 39)"/>
      </svg>
      <button type="button" aria-label="Start five second timer" style="position: absolute; inset: 11px; border-radius: 999px; background: #2E5BFF; border: none; box-shadow: 0 1px 2px rgba(0,0,0,0.08); display: flex; align-items: center; justify-content: center; cursor: pointer">
        <span style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: #FFFFFF">5s</span>
      </button>
    </div>
    <span style="font-size: 13px; font-weight: 600; letter-spacing: -0.01em; color: #7A7268; width: 86px">Shoots when all four pass</span>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
