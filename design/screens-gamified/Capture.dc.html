<!doctype html>
<html lang="en">
<head>

<x-dc>
<helmet>
<style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF9F5; display: flex; flex-direction: column; overflow: hidden">

  <div style="height: 56px; display: flex; align-items: center; padding: 0 20px; flex-shrink: 0">

      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="#4A443D" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <span style="margin-left: 4px; font-size: 17px; font-weight: 600; letter-spacing: -0.016em; color: #1A1714">Front</span>
    <span style="margin-left: auto; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; color: #7A7268">1 of 2</span>
  </div>

  <div style="padding: 2px 20px 0; flex-shrink: 0">
    <p style="margin: 0; font-size: 14px; line-height: 20px; letter-spacing: -0.012em; color: #4A443D">Six checks have to pass before it shoots. That's what makes next month's number comparable to this one.</p>
  </div>

  <div style="padding: 14px 20px 0; display: flex; gap: 6px; flex-wrap: wrap; flex-shrink: 0">
    <span style="display: flex; align-items: center; gap: 5px; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.01em; padding: 5px 10px; border-radius: 999px; background: #E6F4EC; color: #157A49">
      <svg width="10" height="8" viewBox="0 0 10 8" fill="none" aria-hidden="true"><path d="M1 4l2.5 2.5L9 1" stroke="#157A49" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Angle</span>
    <span style="display: flex; align-items: center; gap: 5px; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.01em; padding: 5px 10px; border-radius: 999px; background: #E6F4EC; color: #157A49">
      <svg width="10" height="8" viewBox="0 0 10 8" fill="none" aria-hidden="true"><path d="M1 4l2.5 2.5L9 1" stroke="#157A49" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Light</span>
    <span style="display: flex; align-items: center; gap: 5px; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.01em; padding: 5px 10px; border-radius: 999px; background: #E6F4EC; color: #157A49">
      <svg width="10" height="8" viewBox="0 0 10 8" fill="none" aria-hidden="true"><path d="M1 4l2.5 2.5L9 1" stroke="#157A49" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Sharp</span>
    <span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.01em; padding: 5px 10px; border-radius: 999px; border: 1.5px solid #9A6514; color: #9A6514">Distance</span>
    <span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.01em; padding: 5px 10px; border-radius: 999px; border: 1.5px solid #D8D2C6; color: #7A7268">Neutral face</span>
  </div>

  <div style="padding: 14px 20px 0; flex-grow: 1; min-height: 0">
    <div style="height: 100%; border-radius: 20px; overflow: hidden; background: #221F1A; position: relative; display: flex; align-items: center; justify-content: center">
      <div style="width: 192px; height: 258px; border: 2px solid #9A6514; border-radius: 96px 96px 78px 78px; position: relative">
        <svg viewBox="0 0 192 258" style="position: absolute; inset: 0; width: 100%; height: 100%" aria-hidden="true">
          <line x1="96" y1="14" x2="96" y2="40" stroke="#4A443D" stroke-width="1"/>
          <line x1="96" y1="218" x2="96" y2="244" stroke="#4A443D" stroke-width="1"/>
          <line x1="18" y1="129" x2="44" y2="129" stroke="#4A443D" stroke-width="1"/>
          <line x1="148" y1="129" x2="174" y2="129" stroke="#4A443D" stroke-width="1"/>
        </svg>
      </div>
      <div style="position: absolute; left: 0; right: 0; bottom: 18px; text-align: center">
        <span style="display: inline-block; background: #FBF9F5; color: #1A1714; font-size: 15px; font-weight: 600; letter-spacing: -0.012em; padding: 10px 18px; border-radius: 999px">Arm's length — a bit further</span>
      </div>
    </div>
  </div>

  <div style="padding: 18px 20px 26px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center">
    <div style="position: relative; width: 78px; height: 78px">
      <svg width="78" height="78" viewBox="0 0 78 78" style="position: absolute; inset: 0" aria-hidden="true">
        <circle cx="39" cy="39" r="36" fill="none" stroke="#EFE9DD" stroke-width="4"/>
        <circle cx="39" cy="39" r="36" fill="none" stroke="#2E5BFF" stroke-width="4" stroke-linecap="round" stroke-dasharray="226" stroke-dashoffset="90" transform="rotate(-90 39 39)"/>
      </svg>
      <button type="button" disabled aria-label="Capture, waiting for two more checks" style="position: absolute; inset: 11px; border-radius: 999px; background: #EFE9DD; border: none; box-shadow: 0 1px 2px rgba(0,0,0,0.08); cursor: not-allowed"></button>
    </div>
    <div style="margin-top: 12px; font-size: 13px; font-weight: 500; letter-spacing: -0.01em; color: #7A7268">Two to go — it shoots on its own</div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }

</html>
