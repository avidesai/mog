<!-- @dsCard group="Actions" height=360 -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:20px;background:var(--paper,#FBF9F5);font-family:"Inter Tight",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.stack{display:flex;flex-direction:column;gap:10px;max-width:320px}
button,a{font-family:inherit;font-size:16px;font-weight:700;letter-spacing:-.012em;height:54px;border-radius:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink-500,#7A7268);margin:6px 0 2px}
</style>
<div class="stack">
  <button type="button" style="background:var(--accent,#2E5BFF);border:none;border-bottom:4px solid var(--accent-deep,#1F44CC);color:#fff">Start week 1</button>
  <button type="button" style="background:var(--ink-900,#1A1714);border:none;border-bottom:4px solid #000;color:var(--paper,#FBF9F5)">See all 35 measurements</button>
  <button type="button" style="background:var(--surface-50,#fff);border:1.5px solid var(--line-200,#E6E0D6);border-bottom-width:4px;color:var(--ink-900,#1A1714)">Retake front photo</button>
  <div class="lbl">OPTION ROW · SELECTED</div>
  <button type="button" style="background:var(--surface-50,#fff);border:2px solid var(--accent,#2E5BFF);border-bottom-width:4px;color:var(--ink-900,#1A1714);justify-content:flex-start;padding:0 16px;font-weight:600;font-size:15px;height:56px">Sharper jawline</button>
  <button type="button" disabled style="background:var(--surface-50,#fff);border:1.5px solid var(--line-200,#E6E0D6);border-bottom-width:4px;color:var(--ink-300,#B5ADA2);cursor:not-allowed">Capture (two gates to go)</button>
</div>
