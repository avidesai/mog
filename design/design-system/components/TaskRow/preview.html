<!-- @dsCard group="Habit" height=330 -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:20px;background:var(--paper,#FBF9F5);font-family:"Inter Tight",system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.stack{display:flex;flex-direction:column;gap:10px;max-width:350px}
.t{display:block;font-size:16px;font-weight:600;letter-spacing:-.014em;color:var(--ink-900,#1A1714)}
.s{display:block;margin-top:1px;font-size:13px;letter-spacing:-.01em}
</style>
<div class="stack">

  <div style="background:var(--surface-50,#fff);border:1.5px solid var(--line-200,#E6E0D6);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:14px">
    <svg width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true"><circle cx="15" cy="15" r="15" fill="var(--positive-fill,#1C9D5F)"/><path d="M8.5 15.5l4 4L21.5 11" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span style="flex-grow:1"><span class="t">SPF, morning</span><span class="s" style="color:var(--positive,#157A49)">Done · 34 days running</span></span>
  </div>

  <a href="#" style="text-decoration:none;background:var(--surface-50,#fff);border:1.5px solid var(--line-200,#E6E0D6);border-bottom-width:4px;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:14px">
    <span style="width:30px;height:30px;border-radius:999px;border:2.5px solid var(--ink-300,#B5ADA2);flex-shrink:0"></span>
    <span style="flex-grow:1"><span class="t">Sleep by 11:30</span><span class="s" style="color:var(--ink-500,#7A7268)">For under-eye · week 2 of 8</span></span>
    <svg width="8" height="14" viewBox="0 0 8 14" fill="none" aria-hidden="true"><path d="M1 1l6 6-6 6" stroke="var(--ink-300,#B5ADA2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>

  <div style="background:var(--raised,#F3EFE6);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:14px">
    <span style="width:30px;height:30px;border-radius:999px;background:var(--line-200,#E6E0D6);display:flex;align-items:center;justify-content:center;flex-shrink:0">
      <svg width="13" height="15" viewBox="0 0 16 18" fill="none" aria-hidden="true"><path d="M4.5 7.5V5a3.5 3.5 0 017 0v2.5" stroke="var(--ink-500,#7A7268)" stroke-width="1.8"/><rect x="2.5" y="7.5" width="11" height="8.5" rx="2" stroke="var(--ink-500,#7A7268)" stroke-width="1.8"/></svg>
    </span>
    <span style="flex-grow:1"><span class="t" style="color:var(--ink-700,#4A443D)">Barber — a new shape</span><span class="s" style="color:var(--ink-500,#7A7268)">Opens week 5</span></span>
  </div>

</div>
