<!-- @dsCard group="Habit" height=220 -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:20px;background:var(--paper,#FBF9F5);font-family:"Inter Tight",system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.row{display:flex;gap:18px;align-items:flex-end}
.n{display:flex;flex-direction:column;align-items:center;gap:8px}
.c{font-size:11px;font-weight:600;letter-spacing:.01em;color:var(--ink-500,#7A7268);text-align:center}
</style>
<div class="row">
  <div class="n">
    <span style="width:56px;height:56px;border-radius:999px;background:var(--positive-fill,#1C9D5F);border-bottom:4px solid var(--positive,#157A49);box-sizing:border-box;display:flex;align-items:center;justify-content:center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12.5l4 4L18 8" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span><span class="c">Banked</span>
  </div>
  <div class="n">
    <span style="width:56px;height:56px;border-radius:999px;background:var(--accent,#2E5BFF);border-bottom:4px solid var(--accent-deep,#1F44CC);box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff">4/5</span><span class="c">You're here</span>
  </div>
  <div class="n">
    <span style="width:56px;height:56px;border-radius:999px;background:var(--track,#EFE9DD);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--ink-500,#7A7268)">5</span><span class="c">Ahead</span>
  </div>
  <div class="n">
    <span style="width:66px;height:66px;border-radius:999px;background:var(--surface-50,#fff);border:2px dashed var(--ink-300,#B5ADA2);box-sizing:border-box;display:flex;align-items:center;justify-content:center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="3" stroke="var(--ink-500,#7A7268)" stroke-width="2"/><circle cx="12" cy="13.5" r="3.4" stroke="var(--ink-500,#7A7268)" stroke-width="2"/><path d="M9 7l1.4-2.2h3.2L15 7" stroke="var(--ink-500,#7A7268)" stroke-width="2" stroke-linejoin="round"/></svg>
    </span><span class="c">Scan</span>
  </div>
  <div class="n">
    <span style="width:70px;height:70px;border-radius:999px;background:var(--surface-50,#fff);border:2.5px solid var(--finish,#E0A020);box-sizing:border-box;display:flex;align-items:center;justify-content:center">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 4h10v4.5a5 5 0 01-10 0z" stroke="var(--finish,#E0A020)" stroke-width="2" stroke-linejoin="round"/><path d="M7 6H4.5v1.5A3 3 0 007.5 10.5M17 6h2.5v1.5a3 3 0 01-3 3" stroke="var(--finish,#E0A020)" stroke-width="2" stroke-linejoin="round"/><path d="M12 13.5V17M9 20h6M10 17h4v3h-4z" stroke="var(--finish,#E0A020)" stroke-width="2" stroke-linejoin="round"/></svg>
    </span><span class="c">Week 8</span>
  </div>
</div>
