<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>History — what changed since your last scan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap');
body{margin:0;font-family:"Inter Tight",system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:#2E5BFF}a:hover{color:#1F44CC}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAFAF8; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 16px 20px 12px; border-bottom: 1px solid #E3E3DF">
    <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.020em; color: #111112">History</h1>
    <p style="margin: 4px 0 0; font-size: 13px; line-height: 19px; letter-spacing: -0.01em; color: #6E6E73">3 scans · last on 8 November</p>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 16px 20px 0">

    <div style="background: #FFFFFF; border: 1px solid #E3E3DF; border-radius: 8px; padding: 16px">
      <div style="font-size: 12px; font-weight: 500; letter-spacing: 0.01em; color: #6E6E73">Score over time</div>
      <svg viewBox="0 0 318 90" style="width: 100%; height: 90px; margin-top: 10px" role="img" aria-label="Score moved from 6.1 to 6.4 over three scans">
        <line x1="0" y1="78" x2="318" y2="78" stroke="#E3E3DF" stroke-width="1"/>
        <polyline points="20,58 160,46 300,30" fill="none" stroke="#2E5BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="20" cy="58" r="3.5" fill="#A8A8AD"/>
        <circle cx="160" cy="46" r="3.5" fill="#A8A8AD"/>
        <circle cx="300" cy="30" r="4" fill="#2E5BFF"/>
        <text x="20" y="90" font-size="10" fill="#6E6E73" text-anchor="middle" font-family="Inter Tight, sans-serif">Sep 2</text>
        <text x="160" y="90" font-size="10" fill="#6E6E73" text-anchor="middle" font-family="Inter Tight, sans-serif">Oct 6</text>
        <text x="300" y="90" font-size="10" fill="#6E6E73" text-anchor="middle" font-family="Inter Tight, sans-serif">Nov 8</text>
      </svg>
      <div style="display: flex; align-items: baseline; gap: 10px; margin-top: 4px">
        <span style="font-size: 24px; line-height: 28px; font-weight: 500; letter-spacing: -0.015em; color: #111112">6.4</span>
        <span style="font-size: 15px; font-weight: 500; letter-spacing: -0.012em; color: #1F8A54">+0.3</span>
        <span style="font-size: 11px; letter-spacing: 0.01em; color: #6E6E73">since September</span>
      </div>
    </div>

    <div style="margin-top: 24px; font-size: 12px; font-weight: 500; letter-spacing: 0.01em; color: #6E6E73">What moved</div>

    <div style="margin-top: 12px; background: #FFFFFF; border: 1px solid #E3E3DF; border-radius: 8px">

      <div style="padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <span style="font-size: 15px; line-height: 22px; letter-spacing: -0.012em; color: #111112">Facial adiposity</span>
        <span style="display: flex; align-items: center; gap: 8px; white-space: nowrap">
          <span style="font-size: 13px; color: #A8A8AD">0.71</span>
          <svg width="12" height="8" viewBox="0 0 12 8" fill="none" aria-hidden="true"><path d="M0 4h10M7 1l3 3-3 3" stroke="#A8A8AD" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span style="font-size: 15px; font-weight: 500; color: #111112">0.63</span>
          <span style="font-size: 13px; font-weight: 500; color: #1F8A54">−0.08</span>
        </span>
      </div>

      <div style="padding: 14px 16px; border-top: 1px solid #E3E3DF; display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <span style="font-size: 15px; line-height: 22px; letter-spacing: -0.012em; color: #111112">Cervicomental angle</span>
        <span style="display: flex; align-items: center; gap: 8px; white-space: nowrap">
          <span style="font-size: 13px; color: #A8A8AD">132°</span>
          <svg width="12" height="8" viewBox="0 0 12 8" fill="none" aria-hidden="true"><path d="M0 4h10M7 1l3 3-3 3" stroke="#A8A8AD" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span style="font-size: 15px; font-weight: 500; color: #111112">127°</span>
          <span style="font-size: 13px; font-weight: 500; color: #1F8A54">−5°</span>
        </span>
      </div>

      <div style="padding: 14px 16px; border-top: 1px solid #E3E3DF; display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <span style="font-size: 15px; line-height: 22px; letter-spacing: -0.012em; color: #111112">Skin evenness</span>
        <span style="display: flex; align-items: center; gap: 8px; white-space: nowrap">
          <span style="font-size: 13px; color: #A8A8AD">0.58</span>
          <svg width="12" height="8" viewBox="0 0 12 8" fill="none" aria-hidden="true"><path d="M0 4h10M7 1l3 3-3 3" stroke="#A8A8AD" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span style="font-size: 15px; font-weight: 500; color: #111112">0.61</span>
          <span style="font-size: 13px; font-weight: 500; color: #3A3A3D">+0.03</span>
        </span>
      </div>

    </div>

    <p style="margin: 14px 0 0; font-size: 11px; line-height: 15px; letter-spacing: 0.01em; color: #6E6E73">Bone measurements are not listed because they do not change. Only things that can move are tracked here.</p>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
