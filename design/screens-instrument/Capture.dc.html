<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Capture — front photo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap');
body{margin:0;font-family:"Inter Tight",system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:#2E5BFF}a:hover{color:#1F44CC}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF9F5; display: flex; flex-direction: column; overflow: hidden">

  <div style="height: 52px; display: flex; align-items: center; padding: 0 20px; flex-shrink: 0">
    <button type="button" aria-label="Cancel capture" style="width: 44px; height: 44px; margin-left: -12px; background: none; border: none; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="#4A443D" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <span style="margin-left: 4px; font-size: 15px; font-weight: 600; letter-spacing: -0.012em; color: #1A1714">Front photo</span>
    <span style="margin-left: auto; font-size: 13px; font-weight: 500; letter-spacing: -0.01em; color: #7A7268">1 of 2</span>
  </div>

  <div style="padding: 4px 20px 0; display: flex; gap: 6px; flex-wrap: wrap; flex-shrink: 0">
    <span style="display: flex; align-items: center; gap: 5px; font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.01em; padding: 4px 9px; border-radius: 4px; background: #E8EDFF; color: #2E5BFF">
      <svg width="10" height="8" viewBox="0 0 10 8" fill="none" aria-hidden="true"><path d="M1 4l2.5 2.5L9 1" stroke="#2E5BFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Angle</span>
    <span style="display: flex; align-items: center; gap: 5px; font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.01em; padding: 4px 9px; border-radius: 4px; background: #E8EDFF; color: #2E5BFF">
      <svg width="10" height="8" viewBox="0 0 10 8" fill="none" aria-hidden="true"><path d="M1 4l2.5 2.5L9 1" stroke="#2E5BFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Lighting</span>
    <span style="font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.01em; padding: 4px 9px; border-radius: 4px; border: 1px solid #9A6514; color: #9A6514">Distance</span>
  </div>

  <div style="padding: 14px 20px 0; flex-grow: 1; min-height: 0">
    <div style="height: 100%; border-radius: 16px; overflow: hidden; background: #221F1A; position: relative; display: flex; align-items: center; justify-content: center">
      <div style="width: 196px; height: 266px; border: 1.5px solid #9A6514; border-radius: 98px 98px 80px 80px; position: relative">
        <svg viewBox="0 0 196 266" style="position: absolute; inset: 0; width: 100%; height: 100%" aria-hidden="true">
          <line x1="98" y1="16" x2="98" y2="44" stroke="#4A443D" stroke-width="1"/>
          <line x1="98" y1="222" x2="98" y2="250" stroke="#4A443D" stroke-width="1"/>
          <line x1="20" y1="133" x2="48" y2="133" stroke="#4A443D" stroke-width="1"/>
          <line x1="148" y1="133" x2="176" y2="133" stroke="#4A443D" stroke-width="1"/>
        </svg>
      </div>
      <div style="position: absolute; left: 0; right: 0; bottom: 18px; text-align: center">
        <span style="display: inline-block; background: #FBF9F5; color: #1A1714; font-size: 14px; font-weight: 500; letter-spacing: -0.012em; padding: 9px 16px; border-radius: 999px">Move a little further away</span>
      </div>
    </div>
  </div>

  <div style="padding: 18px 20px 24px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center">
    <div style="position: relative; width: 76px; height: 76px">
      <svg width="76" height="76" viewBox="0 0 76 76" style="position: absolute; inset: 0" aria-hidden="true">
        <circle cx="38" cy="38" r="36" fill="none" stroke="#E6E0D6" stroke-width="3"/>
        <circle cx="38" cy="38" r="36" fill="none" stroke="#2E5BFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="226" stroke-dashoffset="75" transform="rotate(-90 38 38)"/>
      </svg>
      <button type="button" disabled aria-label="Capture, waiting for the distance gate" style="position: absolute; inset: 10px; border-radius: 999px; background: #E6E0D6; border: none; box-shadow: 0 1px 2px rgba(0,0,0,0.08); cursor: not-allowed"></button>
    </div>
    <div style="margin-top: 12px; font-size: 12px; line-height: 16px; letter-spacing: 0.01em; color: #7A7268">Two gates to go — then it shoots on its own</div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
